# ═══════════════════════════════════════════════════════════════
# CI/CD Pipeline — K3 Day12: Cloud Agent
# ═══════════════════════════════════════════════════════════════
#
# Chạy: test (pytest) → build (docker) → deploy (Railway)
# Chỉ deploy khi push lên main và mọi thứ xanh.
#
# Secrets cần thiết (repo → Settings → Secrets → Actions):
#   RAILWAY_TOKEN   — Railway deploy token
# Variables cần thiết:
#   PUBLIC_URL      — URL public của service (không cần che)
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Giả lập AGENT_API_KEY để test không fail vì thiếu biến
  AGENT_API_KEY: test-key-cho-ci
  AGENT_BASE_URL: "https://api.openai.com/v1"

jobs:
  # ── 1. Test ─────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

  # ── 2. Build ─────────────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test   # build chỉ chạy sau test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent:${{ github.sha }} .

  # ── 3. Deploy ────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]   # đợi cả test và build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway login --token "$RAILWAY_TOKEN"
          railway up --service agent

      - name: Smoke test
        run: |
          echo "Chờ service khởi động..."
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/health" || exit 1
          echo "Smoke test passed — service đang chạy"
